version: 1
setups:
  gpt-codex:
    model: openai-gpt-6-astra
    harness: codex
  claude-review:
    model: anthropic-claude-sonnet-5
    harness: claude-code
profiles:
  builder:
    uses: gpt-codex
    role: implementation
  reviewer:
    uses: claude-review
    role: review
defaults:
  profile: builder
  tasks:
    feature: builder
    review: reviewer
